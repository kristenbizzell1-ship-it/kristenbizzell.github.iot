<script>
function sendEmail(){
    let email = document.getElementById("email").value;

    if(!email){
        alert("Please enter your email 💕");
        return;
    }

    // Send to Google Sheets
    fetch("https://script.google.com/macros/s/AKfycbzsZEqC-zC67Bg5oJOR7-qfs7Ug610WLNJorW5rofHqKAhtYttiCwsPf0r7GNrjhbMj/exec", {
        method: "POST",
        body: JSON.stringify({ email: email })
    });

    // Success message
    alert("You're in 💕 Your guide is downloading now!");

    // OPEN YOUR GUIDE (AUTO SEND)
    window.open("30 Day Financial Glow Up Guide.pdf", "_blank");

    // Clear field
    document.getElementById("email").value = "";
}
</script>
